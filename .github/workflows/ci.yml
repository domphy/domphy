name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      - name: Build
        run: pnpm -r build

      # Test
      #
      # Note: the docs site's two real-headless mermaid E2E tests (real
      # Chromium + @mermaid-js/mermaid-cli; apps/web/tests/mermaid/) are
      # OPT-IN via MERMAID_E2E=1 and skip by
      # default — this job deliberately stays hermetic (no browser downloads,
      # no network-dependent renders). Run them manually with
      # `MERMAID_E2E=1 pnpm --filter domphy-web test` when touching
      # apps/web/mermaid's render path. Do not enable the flag here without
      # also provisioning chrome-headless-shell.
      #
      # Note: the 7 Playwright visual lanes (visual, visual:responsive,
      # visual:blocks-responsive, visual:ui-overlays, visual:editor,
      # visual:chart, visual:three — see apps/web/package.json) are
      # deliberately NOT run here: their screenshot baselines are
      # Windows-specific (*-win32.png) and would not match ubuntu-latest
      # font rendering. Run them locally after UI/blocks changes — see
      # apps/web/visual/README.md.
      - name: Test
        run: pnpm -r test

  # Tarball-install smoke test: packs all publishable packages and installs
  # the tarballs into the smoke/ fixture consumers (a Vite app and a
  # plain-Node SSR script) with npm, so workspace `link:` resolution cannot
  # hide missing-deps or exports-map bugs. Needs the packages built, so it
  # builds like the check job (job artifacts are not shared between jobs).
  smoke:
    name: Tarball smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Package lint (publint + attw on tarballs)
        run: pnpm lint:pkg

      - name: Smoke test (tarball installs)
        run: pnpm smoke

  # Front-End Checklist enterprise gate: axe + structural HTML checks against production.
  # Runs after merge to main so deploys are verified; PRs stay fast without live URL flakiness.
  a11y-prod:
    name: A11y audit (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Vercel production deploy
        run: sleep 90

      - name: Axe + structural audit (prod)
        run: pnpm --filter domphy-web exec node scripts/a11y-audit.mjs --warn-only https://domphy.com https://domphy.com/docs/quickstart https://domphy.com/docs/ui/patches/button
